<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCP — Prestadores de Serviço</title>
  <link rel="stylesheet" href="../Styles/shared-style.css">
  <style>
    .badge-ativo   { background: rgba(34,197,94,.15);  color: #4ade80; padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .badge-inativo { background: rgba(239,68,68,.15);  color: #f87171; padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filtros input { flex: 1; min-width: 180px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #1e293b; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 28px; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
    .modal-box h3 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .modal-box label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    .modal-box input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: #0f172a; color: #f1f5f9; font-size: 13px; }
    .modal-box input:focus { outline: none; border-color: #3b82f6; }
    .modal-footer-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="header-left">
      <div class="logo">PCP</div>
      <h2 class="header-text">Prestadores de Serviço</h2>
    </div>
    <button class="btn btn-voltar" id="btnVoltar">← Voltar</button>
  </div>
</header>

<main class="container">

  <!-- FILTROS + NOVO -->
  <section class="card filtros">
    <input type="text" id="filtroBusca" placeholder="Buscar por nome ou serviço...">
    <button class="btn btn-primary" id="btnFiltrar">Filtrar</button>
    <button class="btn btn-success" id="btnNovo">+ Novo Prestador</button>
  </section>

  <!-- TABELA -->
  <section class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Serviço</th>
          <th>CNPJ</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaPrestadores"></tbody>
    </table>
  </section>

</main>

<!-- MODAL CADASTRO / EDIÇÃO -->
<div id="modalPrestador" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modalTitle">Novo Prestador</h3>
    <input type="hidden" id="prestadorId">

    <div>
      <label for="pNome">Nome *</label>
      <input type="text" id="pNome" placeholder="Ex: Costuraria Silva">
    </div>
    <div>
      <label for="pServico">Tipo de serviço *</label>
      <input type="text" id="pServico" placeholder="Ex: costura, corte, montagem">
    </div>
    <div>
      <label for="pCnpj">CNPJ</label>
      <input type="text" id="pCnpj" placeholder="00.000.000/0001-00">
    </div>

    <div class="modal-footer-btns">
      <button class="btn btn-cancel" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<script type="module">
import { apiRequest, getUser, showToast } from "../Scripts/auth.js";

const user = getUser();
if (!user) window.location.href = "login.html";

const tabela = document.getElementById("tabelaPrestadores");
const modal  = document.getElementById("modalPrestador");
const filtro = document.getElementById("filtroBusca");

// ── Carregar ───────────────────────────────────────────────────
async function carregar() {
  tabela.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px">Carregando...</td></tr>`;
  try {
    const res  = await apiRequest("/prestadores");
    const list = res.data || [];
    const q    = filtro.value.trim().toLowerCase();
    const filtrado = q
      ? list.filter(p => p.nome.toLowerCase().includes(q) || p.servico.toLowerCase().includes(q))
      : list;

    if (filtrado.length === 0) {
      tabela.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px">Nenhum prestador encontrado.</td></tr>`;
      return;
    }

    tabela.innerHTML = "";
    filtrado.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.id}</td>
        <td style="font-weight:600">${p.nome}</td>
        <td>${p.servico}</td>
        <td>${p.cnpj || "—"}</td>
        <td><span class="badge-${p.ativo ? "ativo" : "inativo"}">${p.ativo ? "Ativo" : "Inativo"}</span></td>
        <td>
          <button class="btn btn-primary btn-sm btn-editar">Editar</button>
          <button class="btn btn-danger btn-sm btn-excluir">Excluir</button>
        </td>
      `;
      tr.querySelector(".btn-editar").addEventListener("click", () => abrir(p));
      tr.querySelector(".btn-excluir").addEventListener("click", () => excluir(p.id, p.nome));
      tabela.appendChild(tr);
    });
  } catch (e) {
    showToast("Erro ao carregar prestadores.", "error");
    tabela.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#e74c3c;padding:24px">Erro ao carregar.</td></tr>`;
  }
}

// ── Modal ──────────────────────────────────────────────────────
function abrir(p = null) {
  document.getElementById("prestadorId").value            = p?.id || "";
  document.getElementById("pNome").value                  = p?.nome || "";
  document.getElementById("pServico").value               = p?.servico || "";
  document.getElementById("pCnpj").value                  = p?.cnpj || "";
  document.getElementById("modalTitle").textContent       = p ? "Editar Prestador" : "Novo Prestador";
  modal.classList.remove("hidden");
  requestAnimationFrame(() => modal.classList.add("show"));
}

function fechar() {
  modal.classList.remove("show");
  setTimeout(() => modal.classList.add("hidden"), 250);
}

// ── Salvar ─────────────────────────────────────────────────────
async function salvar() {
  const id      = document.getElementById("prestadorId").value;
  const nome    = document.getElementById("pNome").value.trim();
  const servico = document.getElementById("pServico").value.trim();
  const cnpj    = document.getElementById("pCnpj").value.trim();

  if (!nome || !servico) { showToast("Nome e serviço são obrigatórios.", "error"); return; }

  try {
    if (id) {
      await apiRequest(`/prestadores/${id}`, { method: "PUT", body: JSON.stringify({ nome, servico, cnpj, ativo: 1 }) });
      showToast("Prestador atualizado!", "success");
    } else {
      await apiRequest("/prestadores", { method: "POST", body: JSON.stringify({ nome, servico, cnpj }) });
      showToast("Prestador cadastrado!", "success");
    }
    fechar();
    carregar();
  } catch (e) {
    showToast(e.message || "Erro ao salvar.", "error");
  }
}

// ── Excluir ────────────────────────────────────────────────────
async function excluir(id, nome) {
  if (!confirm(`Excluir o prestador "${nome}"?`)) return;
  try {
    await apiRequest(`/prestadores/${id}`, { method: "DELETE" });
    showToast("Prestador removido.", "success");
    carregar();
  } catch (e) {
    showToast(e.message || "Erro ao excluir.", "error");
  }
}

// ── Eventos ────────────────────────────────────────────────────
document.getElementById("btnVoltar").addEventListener("click",  () => window.location.href = "index.html");
document.getElementById("btnNovo").addEventListener("click",    () => abrir());
document.getElementById("btnFiltrar").addEventListener("click", carregar);
document.getElementById("btnSalvar").addEventListener("click",  salvar);
document.getElementById("btnCancelar").addEventListener("click", fechar);
filtro.addEventListener("keydown", e => { if (e.key === "Enter") carregar(); });
modal.addEventListener("click",    e => { if (e.target === modal) fechar(); });

carregar();
</script>
</body>
</html>
