<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIS-ONE — Painel Executivo</title>
  <style>
    :root {
      --bg:          #05090f;
      --surface:     rgba(255,255,255,.05);
      --border:      rgba(255,255,255,.08);
      --text:        #eef2ff;
      --muted:       #a2adbf;
      --brand-primary: #22c55e;
      --brand-secondary: #dc2626;
      --brand-accent: #7c3aed;
      --brand-glow:   rgba(34,197,94,.25);
      --green-glow:  rgba(34,197,94,.25);
      --amber-glow:  rgba(245,158,11,.25);
      --purple-glow: rgba(168,85,247,.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top left, rgba(34,197,94,.09), transparent 15%),
                  radial-gradient(circle at bottom right, rgba(220,38,38,.08), transparent 18%),
                  linear-gradient(180deg, #05090f 0%, #07111b 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 24px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(5,9,15,.92);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-brand { display: flex; align-items: center; gap: 16px; }
    .logo-badge {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #fff;
      box-shadow: 0 0 30px rgba(34,197,94,.28);
      border: 1px solid rgba(255,255,255,.12);
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #fff; }
    .brand-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      padding: 8px 16px;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-secondary), #f97316);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff;
    }
    .user-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .btn-logout {
      padding: 9px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-logout:hover {
      background: var(--brand-secondary);
      border-color: var(--brand-secondary);
      color: #fff;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      text-align: center;
      margin: 20px auto 16px;
      max-width: 980px;
      padding: 30px 24px 24px;
      border-radius: 20px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .75;
      pointer-events: none;
    }
    .hero::before {
      width: 360px; height: 360px;
      top: -140px; right: -120px;
      background: rgba(34,197,94,.20);
    }
    .hero::after {
      width: 260px; height: 260px;
      bottom: -110px; left: -90px;
      background: rgba(220,38,38,.18);
    }
    .hero-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11px; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--brand-primary);
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.18);
      padding: 8px 20px;
      border-radius: 999px;
      margin-bottom: 20px;
      position: relative; z-index: 1;
    }
    .hero h1 {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.05;
      color: #fff;
      margin-bottom: 10px;
      position: relative; z-index: 1;
    }
    .hero p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.9;
      max-width: 640px;
      margin: 0 auto;
      position: relative; z-index: 1;
    }

    /* ── Categorias ── */
    .categorias {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px 16px;
      display: grid;
      gap: 12px;
    }
    .categoria {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.03) 100%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.30);
      transition: transform .25s, box-shadow .25s, border-color .25s, background .25s;
    }
    .categoria:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 100%);
      box-shadow: 0 26px 70px rgba(0,0,0,.34);
    }
    .categoria::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(34,197,94,.14), transparent 30%),
                  radial-gradient(circle at bottom left, rgba(220,38,38,.12), transparent 26%),
                  linear-gradient(120deg, rgba(255,255,255,.02), transparent 35%, rgba(255,255,255,.01));
      pointer-events: none;
    }

    .cat-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px 12px;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .cat-icon {
      width: 42px; height: 42px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }
    .cat-label { font-size: 15px; font-weight: 800; color: #fff; }
    .cat-desc { margin-left: auto; font-size: 12px; color: var(--muted); }
    .cat-chevron { font-size: 13px; color: var(--muted); transition: color .2s; }
    .categoria:hover .cat-chevron { color: #fff; }

    .cat-body {
      position: relative;
      z-index: 1;
      padding: 0 16px 18px;
      display: block;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 16px 16px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 100px;
      transition: transform .25s, box-shadow .25s, border-color .25s, background .25s;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, rgba(34,197,94,.8), rgba(220,38,38,.8));
      opacity: .7;
      border-top-left-radius: 24px;
      border-bottom-left-radius: 24px;
    }
    .card-ico {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .producao .card-ico { background: rgba(34,197,94,.16); }
    .estoque  .card-ico { background: rgba(34,197,94,.16); }
    .pedidos  .card-ico { background: rgba(220,38,38,.16); }
    .sistema  .card-ico { background: rgba(124,58,237,.16); }
    .card-body { min-width: 0; }
    .card-titulo { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
    .card-desc { font-size: 12px; color: var(--muted); line-height: 1.75; }
    .card-arr {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px; color: rgba(255,255,255,.24);
      transition: color .2s, right .15s;
    }
    .card:hover .card-arr { right: 11px; color: #fff; }
    .producao .card:hover .card-arr { color: var(--brand-primary); }
    .estoque  .card:hover .card-arr { color: var(--brand-primary); }
    .pedidos  .card:hover .card-arr { color: var(--brand-secondary); }
    .sistema  .card:hover .card-arr { color: var(--brand-accent); }

    @media (max-width: 768px) {
      header { padding: 18px 20px; flex-wrap: wrap; gap: 14px; }
      .hero { padding: 34px 24px 28px; }
      .categorias { padding: 0 18px 22px; }
      .cat-header { padding: 20px 22px 16px; }
      .cards { grid-template-columns: 1fr; gap: 12px; }
    }

    @media (max-width: 480px) {
      header { padding: 14px 14px; }
      .logo-badge { width: 46px; height: 46px; }
      .brand-title { font-size: 15px; }
      .brand-sub { font-size: 11px; }
      .hero { padding: 24px 16px 22px; }
      .hero h1 { font-size: 26px; }
      .hero p { font-size: 13px; }
      .hero-chip { padding: 6px 16px; }
      .categorias { padding: 0 12px; }
      .card { padding: 16px; gap: 12px; }
      .card-ico { width: 40px; height: 40px; font-size: 18px; }
      .card-titulo { font-size: 12px; }
      .card-desc { font-size: 10px; }
      .user-name { font-size: 11px; }
      .btn-logout { padding: 6px 12px; font-size: 11px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="logo-badge">S1</div>
    <div>
      <div class="brand-title">SIS-ONE</div>
      <div class="brand-sub">Painel Executivo</div>
    </div>
  </div>
  <div class="header-user">
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar">?</div>
      <span class="user-name" id="userInfo"></span>
    </div>
    <button class="btn-logout" id="btnLogout">Sair</button>
  </div>
</header>

<div class="hero">
  <div class="hero-chip">Painel Executivo</div>
  <h1>Seu cockpit de produção</h1>
  <p>Selecione a área para avançar com o controle e a entrega.</p>
</div>

<div class="categorias" id="categorias"></div>

<script>
  const user  = JSON.parse(localStorage.getItem("user"));
  const token = localStorage.getItem("token");
  if (!user || !token) window.location.href = "login.html";

  const nome   = user?.nome || "Usuário";
  const perfil = user?.perfil || "vendas";
  const iniciais = nome.split(" ").slice(0,2).map(p => p[0]).join("").toUpperCase();
  document.getElementById("userInfo").textContent   = `Olá, ${nome}`;
  document.getElementById("userAvatar").textContent = iniciais;

  document.getElementById("btnLogout").addEventListener("click", () => {
    localStorage.clear();
    window.location.href = "login.html";
  });

  // ══════════════════════════════════════════════════════════════
  // MÓDULOS DO SISTEMA — visibilidade controlada por perfil
  // ══════════════════════════════════════════════════════════════
  // Perfis: admin, pcp, logistica, vendas, producao, ped
  // Cada card tem "perfis" → lista de quem pode ver

  // Header dinâmico por perfil
  const PERFIL_HEADER = { producao: { logo: "PROD", sub: "Produção" }, ped: { logo: "P&D", sub: "P&D" } };
  const cfgHeader = PERFIL_HEADER[perfil];
  if (cfgHeader) {
    const logoBadge = document.querySelector(".logo-badge");
    if (logoBadge) logoBadge.textContent = cfgHeader.logo;
    const brandSub = document.querySelector(".brand-sub");
    if (brandSub) brandSub.textContent = cfgHeader.sub;
  }

  const MODULOS = [
    {
      id: "producao", tipo: "categoria", cor: "producao",
      label: "Produção", descCat: "Gerar OP · Gerenciar OPs",
      perfis: ["admin", "pcp", "producao", "ped", "logistica"],
      cards: [
        { titulo: "Gerar OP", desc: "Criar nova Ordem de Produção", href: "gerar-op.html", ico: "📝",
          perfis: ["admin", "pcp", "producao", "ped", "logistica"] },
        { titulo: "Gerenciar OPs", desc: "Acompanhar e controlar ordens em andamento", href: "processos.html", ico: "🏭",
          perfis: ["admin", "pcp", "producao", "ped", "logistica"] },
      ],
    },
    {
      id: "estoque", tipo: "categoria", cor: "estoque",
      label: "Estoque", descCat: "Consulta · Saída de Estoque · Entrada de Notas",
      perfis: ["admin", "pcp", "logistica", "producao", "ped"],
      cards: [
        { titulo: "Estoque", desc: "Consultar estoque de materiais", href: "estoque.html", ico: "🏷️",
          perfis: ["admin", "pcp", "logistica", "producao", "ped"] },
        { titulo: "Saída de Estoque", desc: "Atender pedidos diretamente pelo estoque", href: "saida_estoque.html", ico: "📤",
          perfis: ["admin", "pcp", "logistica"] },
        { titulo: "Entrada de Notas", desc: "Importar XML ou PDF de NF-e e dar entrada no estoque", href: "entrada-notas.html", ico: "📥",
          perfis: ["admin", "pcp", "logistica"] },
      ],
    },
    {
      id: "notas", tipo: "categoria", cor: "pedidos",
      label: "Notas Fiscais", descCat: "Espelho de NF · Listagem",
      perfis: ["admin", "pcp", "logistica"],
      cards: [
        { titulo: "Gerar Espelho de NF", desc: "Criar espelho de nota fiscal de saída", href: "espelho-nf.html", ico: "📄",
          perfis: ["admin", "pcp", "logistica"] },
        { titulo: "Espelhos Emitidos", desc: "Consultar espelhos de NF emitidos", href: "espelhos-nf.html", ico: "📋",
          perfis: ["admin", "pcp", "logistica"] },
      ],
    },
    {
      id: "cadastros", tipo: "categoria", cor: "estoque",
      label: "Cadastros", descCat: "Materiais · Prestadores",
      perfis: ["admin", "pcp", "logistica"],
      cards: [
        { titulo: "Materiais", desc: "Cadastro e controle de materiais e insumos", href: "produtos.html", ico: "📦",
          perfis: ["admin", "pcp", "logistica"] },
        { titulo: "Prestadores", desc: "Cadastro de prestadores de serviço", href: "prestadores.html", ico: "🤝",
          perfis: ["admin", "pcp", "logistica"] },
      ],
    },
    {
      id: "pedidos", tipo: "categoria", cor: "pedidos",
      label: "Pedidos", descCat: "Controle de Pedidos",
      perfis: ["admin", "pcp", "logistica", "vendas"],
      cards: [
        { titulo: "Controle de Pedidos", desc: "Pedidos de venda e ordens de compra", href: "pedidos.html", ico: "💰",
          perfis: ["admin", "pcp", "logistica", "vendas"] },
      ],
    },
    {
      id: "sistema", tipo: "categoria", cor: "sistema",
      label: "Sistema", descCat: "Logs · Relatórios · Backup",
      perfis: ["admin"],
      cards: [
        { titulo: "Sistema", desc: "Backup, exportação e configurações", href: "sistema.html", ico: "📋",
          perfis: ["admin"] },
        { titulo: "Relatórios", desc: "Estoque, pedidos, OPs e desempenho", href: "relatorios.html", ico: "📊",
          perfis: ["admin", "pcp"] },
      ],
    },
  ];

  // ── Renderiza módulos visíveis para o perfil ──
  const container = document.getElementById("categorias");

  MODULOS.forEach(mod => {
    if (!mod.perfis.includes(perfil)) return;

    if (mod.tipo === "destaque") {
      container.innerHTML += `
        <div class="categoria" style="margin-bottom:8px">
          <a class="card" href="${mod.href}" style="border:1.5px solid rgba(34,197,94,.25);background:rgba(34,197,94,.06);border-radius:14px;">
            <div class="card-ico">${mod.ico}</div>
            <div class="card-body">
              <div class="card-titulo" style="color:#86efac">${mod.titulo}</div>
              <div class="card-desc">${mod.desc}</div>
            </div>
            <span class="card-arr">\u2192</span>
          </a>
        </div>`;
      return;
    }

    // Filtra cards visíveis
    const cardsVisiveis = (mod.cards || []).filter(c => c.perfis.includes(perfil));
    if (!cardsVisiveis.length) return;

    const descAtual = cardsVisiveis.map(c => c.titulo).join(" \u00b7 ");

    container.innerHTML += `
      <div class="categoria ${mod.cor}">
        <div class="cat-header">
          <div class="cat-icon">${{producao:"\u2699\uFE0F",estoque:"\uD83D\uDCE6",pedidos:"\uD83E\uDDFE",sistema:"\uD83D\uDEE0\uFE0F"}[mod.cor] || "\uD83D\uDCC1"}</div>
          <span class="cat-label">${mod.label}</span>
          <span class="cat-desc">${descAtual}</span>
          <span class="cat-chevron">\u25B6</span>
        </div>
        <div class="cat-body"><div class="cat-body-inner"><div class="cards">
          ${cardsVisiveis.map(c => `
            <a class="card" href="${c.href}">
              <div class="card-ico">${c.ico}</div>
              <div class="card-body">
                <div class="card-titulo">${c.titulo}</div>
                <div class="card-desc">${c.desc}</div>
              </div>
              <span class="card-arr">\u2192</span>
            </a>`).join("")}
        </div></div></div>
      </div>`;
  });
</script>
</body>
</html>
